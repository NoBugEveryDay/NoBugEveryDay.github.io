<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 背景透明，供浅色/暗色卡片使用；文字统一深色，暗色需另出变体 -->
  <style>
    svg {
      --bg:#fbfbf9; --fg:#1f2328; --muted:#667; --white:#ffffff;
      --border:#d8d8d0; --red:#c0392b; --blue:#2a7de1; --green:#2f7a3d;
      --red-border:#e0b4ae; --green-border:#7fb069; --node:#889;
      --red-fill:#fdf0ef; --green-fill:#eef4ee; --blue-fill:#e3ecf7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#1b1e23; --fg:#e6e6e6; --muted:#9aa; --white:#1b1e23;
        --border:#3d444d; --red:#ff8a7a; --blue:#6cb2ff; --green:#5bbd7a;
        --red-border:#6a3a34; --green-border:#3f6a4f; --node:#9aa;
        --red-fill:#33231f; --green-fill:#22322a; --blue-fill:#22324a;
      }
    }

    .box{fill:var(--bg);stroke:var(--border);stroke-width:1.5;}
    .boxtitle{fill:var(--red);font-size:17px;font-weight:700;}
    .boxsub{fill:var(--fg);font-size:13px;}
    .dir{fill:var(--muted);font-size:12px;}
    .arrow{stroke:var(--fg);stroke-width:2;fill:none;marker-end:url(#arr);}
    .cap{fill:var(--fg);font-size:13px;text-anchor:middle;}
  </style>
  <rect width="720" height="400" style="fill: var(--bg)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" style="fill: var(--fg)"/>
    </marker>
  </defs>

  <!-- ① 场插值 -->
  <rect class="box" x="30" y="40" width="290" height="110" rx="10"/>
  <text class="boxtitle" x="50" y="72">① 场插值 Interpolation</text>
  <text class="boxsub" x="50" y="96">网格 → 粒子：读 8 个网格点</text>
  <text class="boxsub" x="50" y="116">算 1 个粒子的 E、B</text>
  <text class="dir" x="50" y="136">（多对一 · 内积）</text>

  <!-- ② 粒子推进 -->
  <rect class="box" x="400" y="40" width="290" height="110" rx="10"/>
  <text class="boxtitle" x="420" y="72">② 粒子推进 Push</text>
  <text class="boxsub" x="420" y="96">洛伦兹力 → 更新速度</text>
  <text class="boxsub" x="420" y="116">与位置（纯粒子计算）</text>
  <text class="dir" x="420" y="136">（纯粒子）</text>

  <!-- ④ 场求解 -->
  <rect class="box" x="400" y="250" width="290" height="110" rx="10"/>
  <text class="boxtitle" x="420" y="282">④ 场求解 Field Solve</text>
  <text class="boxsub" x="420" y="306">在网格上解麦克斯韦方程</text>
  <text class="boxsub" x="420" y="326">更新 E、B</text>
  <text class="dir" x="420" y="346">（纯网格）</text>

  <!-- ③ 电流沉积 -->
  <rect class="box" x="30" y="250" width="290" height="110" rx="10"/>
  <text class="boxtitle" x="50" y="282">③ 电流沉积 Deposition</text>
  <text class="boxsub" x="50" y="306">粒子 → 网格：1 个粒子把电流</text>
  <text class="boxsub" x="50" y="326">写回 8 个网格点</text>
  <text class="dir" x="50" y="346">（一对多 · 外积）</text>

  <!-- 循环箭头 -->
  <path class="arrow" d="M320 95 L398 95"/>
  <path class="arrow" d="M545 152 L545 248"/>
  <path class="arrow" d="M400 305 L322 305"/>
  <path class="arrow" d="M175 248 L175 152"/>

  <text class="cap" x="360" y="82">下一步</text>
  <text class="cap" x="576" y="206">下一步</text>
  <text class="cap" x="360" y="326">下一步</text>
  <text class="cap" x="144" y="206">下一步</text>
</svg>
